name: Bug report
description: 报告可以稳定复现的程序问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "请勿提交密码、Token、SSH 私钥、Recovery codes 或个人隐私。"
  - type: input
    id: page
    attributes:
      label: 页面或章节
      placeholder: /play，第 10 章
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开页面开始，逐步写出操作。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: macOS 15 / Chrome / Node 24.21.0
    validations:
      required: true
