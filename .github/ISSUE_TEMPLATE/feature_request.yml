name: Feature request
description: 提议不突破产品安全边界的新功能
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: learner_problem
    attributes:
      label: 初学者遇到的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 安全边界
      options:
        - label: 不要求凭据、OAuth 或真实 GitHub API 验证
          required: true
        - label: 不把 Star、分享或赞助作为解锁条件
          required: true
